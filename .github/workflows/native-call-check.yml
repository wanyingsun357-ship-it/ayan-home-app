name: Native call compile check
on:
  push:
    branches: [codex/native-call-20261025, codex/call-captions-20261025, codex/native-call-repair-20261030, codex/call-sound-20261031, codex/yamnet-call-20261031]
    paths-ignore: ['tools/yamnet/**', '.github/workflows/yamnet-model.yml']
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Sound policy, YIN and delayed ASR checks
        run: |
          node tools/yamnet/generate-rules.cjs --check
          swiftc -O ios/App/App/CallSoundPolicy.swift ios/App/App/CallVocalFeatures.swift tests/call-sound/main.swift -o /tmp/call-sound-policy
          /tmp/call-sound-policy
          swiftc -O ios/App/App/CallSoundPolicy.swift ios/App/App/CallVocalFeatures.swift ios/App/App/CallSoundAnalyzer.swift tests/call-sound-analyzer/main.swift -framework CoreML -o /tmp/call-sound-analyzer
          /tmp/call-sound-analyzer
      - name: Web and Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Compile iOS without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
