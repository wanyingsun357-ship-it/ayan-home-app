name: Convert and verify YAMNet
on:
  push:
    branches: [codex/yamnet-call-20261031]
    paths: ['tools/yamnet/**', '.github/workflows/yamnet-model.yml']
jobs:
  model:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned conversion dependencies
        run: |
          python -m pip install --upgrade pip
          TF_PACKAGE=tensorflow
          if [ "$(uname -m)" = "arm64" ]; then TF_PACKAGE=tensorflow-macos; fi
          python -m pip install "$TF_PACKAGE==2.12.0" coremltools==7.2 numpy==1.23.5 scipy==1.10.1 jax==0.4.18 jaxlib==0.4.18 protobuf==3.20.3
      - name: Convert and compare with original TensorFlow model
        run: python tools/yamnet/convert.py
      - name: Commit only validated public model assets
        run: |
          git config user.name 'home-backup'
          git config user.email 'backup@home'
          git add ios/App/App/YAMNet.mlpackage ios/App/App/YAMNet-labels.json ios/App/App/YAMNet-validation.json
          git commit -m 'Bundle validated YAMNet Core ML model and equivalence report'
          git push origin HEAD:codex/yamnet-call-20261031
      - uses: actions/upload-artifact@v4
        with:
          name: yamnet-validation
          path: ios/App/App/YAMNet-validation.json
          retention-days: 14
